## 1. Introduction
The Business Inventory & Order Management System is a comprehensive, centralized web application designed to streamline and automate core business operations. Its primary scope includes managing product inventory, tracking stock levels in real-time, facilitating purchase and sales order processing, and recording customer payments. The system provides role-based access to ensure data security and operational integrity.

## 2. Case Study
Small and medium-sized businesses frequently rely on manual methods or disjointed software to manage their inventory and sales. This traditional approach leads to significant challenges, including stock discrepancies, duplicate data entry, fulfillment delays, and a severe lack of operational visibility. Without a unified system, businesses struggle to scale, make informed decisions, and maintain customer satisfaction.

## 3. Problem Statement
Businesses need a centralized, reliable system for inventory and sales operations. The absence of such a system results in inefficient manual tracking, inability to prevent stockouts or overstocking, and a lack of real-time insights into business performance. A unified platform is necessary to integrate inventory control, order processing, and financial tracking.

## 4. Objectives
1. Analyze the core problems associated with manual inventory management.
2. Identify the necessary entities and their relationships within the business domain.
3. Design a robust and scalable relational database schema.
4. Create a comprehensive Entity-Relationship Diagram (ERD).
5. Implement the backend system using the Django framework.
6. Build secure and efficient RESTful APIs using Django REST Framework.
7. Develop a responsive and interactive user interface using React.
8. Connect the React frontend seamlessly with the Django backend.
9. Implement token-based authentication and role-based access control.
10. Implement full CRUD (Create, Read, Update, Delete) operations for all core entities.
11. Demonstrate complex database relationships effectively in the UI.
12. Test the application thoroughly to ensure reliability.
13. Document the system architecture, design decisions, and usage instructions.
14. Maintain the project source code on a GitHub repository.

## 5. Requirements
### Functional Requirements
- **Authentication:** Users must be able to log in securely. Role-based access (Admin/Staff) must be enforced.
- **Product Management:** Ability to add, edit, view, and delete products, including SKU, pricing, and reorder levels.
- **Category Management:** Group products into logical categories.
- **Supplier Management:** Maintain a directory of suppliers with contact details.
- **Customer Management:** Maintain a database of customers for sales tracking.
- **Purchase Management:** Create purchase orders, add items, and track order status (Draft, Pending, Confirmed).
- **Sales Order Management:** Create sales orders, allocate stock, and track order status.
- **Payment Management:** Record payments against specific sales orders.
- **Dashboard:** Provide an overview of stock levels, recent orders, and key metrics.

### Non-functional Requirements
- **Performance:** API responses should be fast and efficient under typical load.
- **Security:** Secure API endpoints via token authentication. Protect against SQL injection and XSS.
- **Usability:** The interface must be intuitive and require minimal training for staff.
- **Responsiveness:** The UI must adapt to different screen sizes (desktop, tablet, mobile).
- **Maintainability:** Code must be modular, well-documented, and follow standard design patterns.

## 6. Users and Roles
- **Administrator:** Full access to all system features. Can manage users, edit critical data, view all financial records, and configure system settings.
- **Staff:** Limited access intended for day-to-day operations. Can create orders, manage inventory levels, and view basic reports, but may be restricted from administrative functions.

## 7. Database Analysis

### UserProfile
- **Purpose:** Extends the default Django User model to add business-specific data.
- **Attributes:** `id` (Auto), `user` (OneToOne), `role` (CharField), `phone` (CharField).
- **Primary Key:** `id`
- **Foreign Keys:** `user_id` (references auth_user)
- **Relationships:** 1:1 with User.
- **Reason:** Keeps the auth system clean while storing additional app-specific user details.

### Category
- **Purpose:** Groups products into logical classifications for easy retrieval.
- **Attributes:** `id` (Auto), `name` (CharField), `description` (TextField), `created_at` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** None
- **Relationships:** 1:M with Product.
- **Reason:** Essential for inventory organization and filtering.

### Product
- **Purpose:** Stores the catalog of items the business buys and sells.
- **Attributes:** `id` (Auto), `category` (ForeignKey), `name` (CharField), `sku` (CharField), `description` (TextField), `price` (DecimalField), `cost_price` (DecimalField), `reorder_level` (IntegerField), `created_at` (DateTimeField), `updated_at` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** `category_id` (references Category)
- **Relationships:** M:1 with Category, 1:1 with Stock, 1:M with PurchaseItem, 1:M with OrderItem.
- **Reason:** The core entity around which inventory and orders revolve.

### Stock
- **Purpose:** Tracks the current physical quantity of a product.
- **Attributes:** `id` (Auto), `product` (OneToOne), `quantity` (IntegerField), `updated_at` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** `product_id` (references Product)
- **Relationships:** 1:1 with Product.
- **Reason:** Separating stock from the product model allows for high-frequency updates without locking the main product record.

### Supplier
- **Purpose:** Stores details of vendors who provide products.
- **Attributes:** `id` (Auto), `name` (CharField), `email` (EmailField), `phone` (CharField), `address` (TextField), `created_at` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** None
- **Relationships:** 1:M with PurchaseOrder.
- **Reason:** Necessary for generating purchase orders and tracking sourcing.

### Customer
- **Purpose:** Stores details of clients who purchase products.
- **Attributes:** `id` (Auto), `name` (CharField), `email` (EmailField), `phone` (CharField), `address` (TextField), `created_at` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** None
- **Relationships:** 1:M with SalesOrder.
- **Reason:** Required for order tracking, invoicing, and relationship management.

### PurchaseOrder
- **Purpose:** Represents a formal request to buy products from a supplier.
- **Attributes:** `id` (Auto), `supplier` (ForeignKey), `created_by` (ForeignKey), `order_date` (DateField), `status` (CharField), `total_amount` (DecimalField), `created_at` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** `supplier_id` (references Supplier), `created_by_id` (references User)
- **Relationships:** M:1 with Supplier, M:1 with User, 1:M with PurchaseItem.
- **Reason:** Provides a vital audit trail for procurement.

### PurchaseItem
- **Purpose:** A junction table detailing specific products and quantities in a purchase order.
- **Attributes:** `id` (Auto), `purchase_order` (ForeignKey), `product` (ForeignKey), `quantity` (IntegerField), `unit_cost` (DecimalField), `subtotal` (DecimalField).
- **Primary Key:** `id`
- **Foreign Keys:** `purchase_order_id` (references PurchaseOrder), `product_id` (references Product).
- **Relationships:** M:1 with PurchaseOrder, M:1 with Product.
- **Reason:** Resolves the M:M relationship between POs and Products, holding line-item specific data.

### SalesOrder
- **Purpose:** Represents a customer's request to purchase goods.
- **Attributes:** `id` (Auto), `customer` (ForeignKey), `created_by` (ForeignKey), `order_date` (DateField), `status` (CharField), `total_amount` (DecimalField), `created_at` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** `customer_id` (references Customer), `created_by_id` (references User).
- **Relationships:** M:1 with Customer, M:1 with User, 1:M with OrderItem, 1:M with Payment.
- **Reason:** Essential for fulfillment, revenue tracking, and stock deduction.

### OrderItem
- **Purpose:** A junction table detailing specific products in a sales order.
- **Attributes:** `id` (Auto), `sales_order` (ForeignKey), `product` (ForeignKey), `quantity` (IntegerField), `unit_price` (DecimalField), `subtotal` (DecimalField).
- **Primary Key:** `id`
- **Foreign Keys:** `sales_order_id` (references SalesOrder), `product_id` (references Product).
- **Relationships:** M:1 with SalesOrder, M:1 with Product.
- **Reason:** Resolves the M:M relationship between SOs and Products, holding line-item specific data.

### Payment
- **Purpose:** Records financial transactions against sales orders.
- **Attributes:** `id` (Auto), `sales_order` (ForeignKey), `amount` (DecimalField), `payment_method` (CharField), `status` (CharField), `payment_date` (DateTimeField).
- **Primary Key:** `id`
- **Foreign Keys:** `sales_order_id` (references SalesOrder).
- **Relationships:** M:1 with SalesOrder.
- **Reason:** Tracks revenue collection and order financial status.

## 9. Relationship Explanation
- **One-to-One (1:1):** 
  - `User` ↔ `UserProfile`: Each user has exactly one profile extending their data.
  - `Product` ↔ `Stock`: Each product has exactly one associated stock record representing its physical count.
- **One-to-Many (1:M):**
  - `Category` → `Products`: A category can hold many products, but a product belongs to one category.
  - `Supplier` → `PurchaseOrders`: A supplier can receive many POs.
  - `Customer` → `SalesOrders`: A customer can place many orders.
  - `SalesOrder` → `Payments`: A single order might have multiple payment installments.
- **Many-to-Many (M:M):**
  - `PurchaseOrder` ↔ `Product`: Resolved via the `PurchaseItem` junction table.
  - `SalesOrder` ↔ `Product`: Resolved via the `OrderItem` junction table.
  - *Why junction tables are needed:* A standard M:M relationship only links IDs. Junction tables are required because each relationship instance carries extra, vital data—specifically, the `quantity` purchased/sold and the `price` at the time of the transaction.

## 11. API Architecture
The system uses RESTful (Representational State Transfer) architecture. Resources (Products, Orders, Users) are exposed as distinct URLs. Standard HTTP methods denote actions: `GET` (read), `POST` (create), `PUT/PATCH` (update), and `DELETE` (remove). Data is exchanged strictly in JSON format.

**Token Authentication Flow:**
1. Client sends credentials (username/password) to the login endpoint.
2. Server verifies credentials and returns a secure cryptographic Token.
3. Client stores the Token (e.g., in localStorage).
4. For all subsequent requests, the client attaches the Token in the HTTP `Authorization` header (`Authorization: Token <token_string>`).
5. Server validates the token before processing the request.

## 15. Django Backend
The backend is structured into modular apps: `accounts`, `inventory`, and `orders`.
- **Models:** Defined using Django ORM to represent DB tables (e.g., `inventory.models.Product`).
- **Serializers:** Django REST Framework serializers translate complex Model instances into JSON and validate incoming data.
- **Views:** ViewSets (e.g., `ModelViewSet`) are utilized to handle standard CRUD operations rapidly, keeping views clean and logic-focused.
- **URLs:** App-level routing utilizes DRF Routers to automatically map URLs to ViewSet actions.
- **Authentication/Permissions:** The system utilizes DRF's Token Authentication. Permission classes (`IsAuthenticated`) are applied globally or at the view level to secure endpoints.

## 16. React Frontend
The frontend uses a modern React architecture powered by Vite.
- **Pages:** Top-level components (e.g., Dashboard, Products, SalesOrders) that represent routes.
- **Components:** Reusable UI elements (Buttons, Tables, Modals, Forms).
- **Routing:** Handled via React Router (`react-router-dom`), mapping URL paths to Pages.
- **API Services:** A dedicated layer (often using Axios) abstracts HTTP calls, keeping components clean.
- **State Management:** React hooks (`useState`, `useEffect`, `useContext`) handle local component state and global auth state.

## 17. Integration
React integrates with Django via HTTP requests over the network. 
1. **Axios Instance:** An Axios instance is configured with a base URL pointing to the Django API.
2. **Token Interceptor:** An Axios interceptor automatically attaches the authentication token (from localStorage) to the `Authorization` header of every outgoing request.
3. **State Cycle:** Components trigger API calls (e.g., on mount via `useEffect` or on form submit). The response data updates React state, triggering a re-render of the UI with the fresh data from Django.

## 20. Results
The finalized application provides a reliable, secure, and user-friendly interface for inventory management. The business can now successfully track products, generate complex purchase and sales orders, and monitor real-time stock levels, entirely eliminating the reliance on error-prone manual spreadsheets. The decoupled architecture ensures the backend API can be extended easily for future mobile applications.

## 21. Challenges and Solutions
1. **CORS Configuration:** 
   - *Challenge:* Browser blocked React requests to Django. 
   - *Solution:* Configured `django-cors-headers` to explicitly allow the React dev server origin.
2. **Nested Serializer Creation:**
   - *Challenge:* Creating an Order and its OrderItems in a single request was complex.
   - *Solution:* Overrode the `create()` method in the Django Order serializer to handle nested item creation transactionally.
3. **Stock Management Atomicity:**
   - *Challenge:* Simultaneous orders could lead to race conditions and incorrect stock counts.
   - *Solution:* Used Django's `F()` expressions and database transactions (`transaction.atomic`) to ensure stock updates are reliable.
4. **Token Auth Integration:**
   - *Challenge:* Managing token lifecycle securely in the React frontend.
   - *Solution:* Used Axios interceptors to automatically append tokens and handle 401 responses gracefully by redirecting to login.
5. **Responsive Design:**
   - *Challenge:* Data-heavy tables were difficult to view on mobile devices.
   - *Solution:* Implemented TailwindCSS responsive classes to convert tables to card-based layouts on smaller screens.

## 22. Future Improvements
1. **Automated Reorder Alerts:** Send email notifications when stock falls below the `reorder_level`.
2. **Barcode Integration:** Allow camera-based barcode scanning for quick product lookup and order fulfillment.
3. **Advanced Analytics:** Generate graphical reports for sales trends and profitability using libraries like Chart.js.
4. **Multi-Warehouse Support:** Expand the database schema to track stock across different physical locations.
5. **PDF Invoicing:** Generate downloadable PDF receipts and invoices for sales orders.
6. **Role-based UI Rendering:** Hide UI elements completely based on the user's explicit role (Admin vs. Staff).

                    btn.innerHTML = '🖨️ Save as PDF (Ready)';
                });
            }, 300);
        });
    </script>
</body>
